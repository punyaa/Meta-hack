[project]
name = "signalforge"
version = "0.1.0"
description = "Turn visual captures and notes into a source-backed field report and build blueprint."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115.0",
  "imagehash>=4.3.2",
  "jinja2>=3.1.4",
  "meta-sam-parser>=0.1.0",
  "numpy>=2.1.0",
  "openai>=1.60.0",
  "opencv-python-headless>=4.10.0.84",
  "pillow>=11.0.0",
  "psycopg[binary]>=3.1",
  "pydantic-settings>=2.7.0",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.34.0",
  "vercel-blob>=0.5.0",
]

[tool.vercel]
entrypoint = "signalforge.main:app"

[dependency-groups]
dev = [
  "pytest>=8.3.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"

